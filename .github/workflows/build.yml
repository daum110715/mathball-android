name: Build APK

on:
  workflow_dispatch:
    inputs:
      requirements:
        description: '覆盖 buildozer.spec 的 requirements(留空用默认)'
        required: false
        default: ''
      buildozer_version:
        description: 'buildozer 版本(stable / master / 具体 tag / git+ 地址)'
        required: false
        default: 'stable'
  push:
    branches: [main]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ "${{ github.event.inputs.buildozer_version }}" = "master" ]; then
            python -m pip install "git+https://github.com/kivy/buildozer.git@master"
          else
            python -m pip install buildozer
          fi

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          key: aplat-${{ runner.os }}-v1
          restore-keys: |
            aplat-${{ runner.os }}-

      - name: Override requirements
        if: github.event.inputs.requirements != ''
        run: |
          sed -i "s|^requirements = .*|requirements = ${{ github.event.inputs.requirements }}|" buildozer.spec
          grep '^requirements' buildozer.spec

      - name: Show effective spec
        run: grep -vE '^\s*(#|$)' buildozer.spec

      - name: Build debug APK
        run: buildozer android debug

      - name: Dump build log on failure
        if: failure()
        run: |
          find .buildozer -name 'build.log' -print -exec tail -n 400 {} \; || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mathball-debug-apk
          path: bin/*.apk
          if-no-files-found: error
